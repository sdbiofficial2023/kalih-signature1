name: Deploy to DomaiNesia

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secret dilewatkan sebagai env, bukan diinterpolasi ke dalam perintah:
      # kalau ditempel langsung, isi token yang mengandung $, backtick, atau
      # tanda kutip akan diurai oleh shell dan file-nya rusak tanpa error.
      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -z "$ENV_LOCAL" ]; then
            echo "::error::Secret ENV_LOCAL kosong — set di Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$ENV_LOCAL" > .env.local

      - name: Build
        run: pnpm run build

      - name: Package standalone output
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/
          tar -czf deploy.tar.gz -C .next/standalone .

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Kosongkan secret ini kalau key-nya dibuat tanpa passphrase.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: deploy.tar.gz
          target: "~/"

      - name: Extract and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd ~/kalihcoffee
            rm -rf .next/standalone
            mkdir -p .next/standalone
            tar -xzf ~/deploy.tar.gz -C .next/standalone
            rm ~/deploy.tar.gz
            mkdir -p tmp
            touch tmp/restart.txt
